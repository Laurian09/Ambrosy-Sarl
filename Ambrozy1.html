<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AMBROZY – Plateforme de gestion de flotte</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F4F3EF;--cd:#fff;--tx:#1B1B1B;--mu:#5A5A5A;--bd:#E3E1DA;--ac:#F5B800;--at:#17181A;--sd:#17181A;--rb:#FDE8E6;--rt:#8C1D18;--ob:#FFF1D6;--ot:#7A4B00;--gb:#E3F4E6;--gt:#1D5E2C;--nb:#ECECEA;--nt:#3A3A3A;--in:#9A9A94;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--cd:#1C1D20;--tx:#F2F2F0;--mu:#A8A8A2;--bd:#2E3033;--rb:#4A1B18;--rt:#FFB4AB;--ob:#4A3510;--ot:#FFD58A;--gb:#17381F;--gt:#9BE0AB;--nb:#2A2B2E;--nt:#D0D0CC;--in:#6E6E69}}
:root[data-theme="dark"]{--bg:#121315;--cd:#1C1D20;--tx:#F2F2F0;--mu:#A8A8A2;--bd:#2E3033;--rb:#4A1B18;--rt:#FFB4AB;--ob:#4A3510;--ot:#FFD58A;--gb:#17381F;--gt:#9BE0AB;--nb:#2A2B2E;--nt:#D0D0CC;--in:#6E6E69}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--sd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;color:#F5B800;font-weight:800;font-size:19px;padding:0 8px 16px}.brand img{width:42px;height:42px;border-radius:50%}
.nv{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#E8E8E8;background:none;border:0;text-align:left;cursor:pointer;min-height:44px;width:100%}
.nv.on{background:var(--ac);color:#17181A;font-weight:700}.ab{display:none;font-weight:700;font-size:13px}
main{padding:22px 26px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:24px}h2{margin:0 0 10px;font-size:15px}.mu{color:var(--mu);font-size:13px;margin:2px 0 0}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}
.g{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.c2{grid-template-columns:2fr 1fr}.e2{grid-template-columns:1fr 1fr}
.kv{font-size:24px;font-weight:700;margin-top:4px}
.bt{background:var(--ac);color:var(--at);border:0;border-radius:10px;padding:0 18px;min-height:44px;font-weight:700;cursor:pointer}.bg{background:var(--cd);border:1px solid var(--tx);border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer}
.sm{min-height:36px;padding:0 12px;font-size:13px}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.r{background:var(--rb);color:var(--rt)}.o{background:var(--ob);color:var(--ot)}.gr{background:var(--gb);color:var(--gt)}.n{background:var(--nb);color:var(--nt)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mu);padding:9px 8px;border-bottom:1px solid var(--bd)}td{padding:10px 8px;border-bottom:1px solid var(--bd);font-size:13px}
.ch{display:flex;gap:8px;flex-wrap:wrap}.chp{padding:9px 14px;border-radius:99px;border:1px solid var(--in);background:var(--cd);cursor:pointer;min-height:40px}.chp.on{background:var(--sd);color:#fff;border-color:var(--sd)}
label{display:block;font-size:13px;margin-bottom:10px}input,select{display:block;width:100%;margin-top:4px;min-height:44px;padding:0 12px;border:1px solid var(--in);border-radius:8px;background:var(--cd)}
.bar{height:10px;border-radius:6px;background:var(--nb);margin:4px 0 10px}.bar i{display:block;height:10px;border-radius:6px;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.opt{display:block;width:100%;text-align:left;background:var(--cd);border:2px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}.opt:hover{border-color:var(--ac)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:var(--sd);color:#fff}.hero img{width:110px;height:110px;border-radius:50%}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px}.pf button{background:#26272B;color:#fff;border:1px solid #3A3B40;border-radius:12px;padding:16px;min-height:72px;cursor:pointer;text-align:left}.pf b{display:block;color:#F5B800}
.sg{display:block;width:100%;height:170px;border:1px dashed var(--in);border-radius:10px;background:var(--cd);touch-action:none}input[type=checkbox]{display:inline-block;width:22px;height:22px;min-height:0;margin:0 8px 0 0;vertical-align:middle}.spn{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto}@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spn{animation:none}}.lg{background:var(--cd);color:var(--tx);border-radius:16px;padding:22px;width:min(100%,380px);text-align:left}.lg label{color:var(--tx)}.er{color:var(--rt);background:var(--rb);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--sd);color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:90vw}
@media(max-width:1023px){.app{grid-template-columns:78px minmax(0,1fr)}.brand span,.nv .lb{display:none}.brand{padding:0 0 14px;justify-content:center}.nv{justify-content:center;padding:10px 4px}.ab{display:inline}.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.c2{grid-template-columns:1fr}}
@media(max-width:699px){.app{display:block;padding-bottom:70px}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;gap:2px}.brand{display:none}.nv{flex-direction:column;gap:0;min-width:74px;width:auto;font-size:11px;padding:6px 4px}.nv .lb{display:block}.ab{display:none}main{padding:16px 14px 24px}h1{font-size:20px}.k4,.k3,.e2{grid-template-columns:1fr 1fr}.pf{grid-template-columns:1fr}
table,tbody,tr,td{display:block}thead{display:none}tr{padding:8px 0;border-bottom:1px solid var(--bd)}td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0}td::before{content:attr(data-l);color:var(--mu);font-size:12px}}
</style></head><body><div id="root"></div>

return `<div class="top"><span class="mu">${S.U.length} comptes</span><button class="bt" data-a="newu">Créer un compte</button></div>${S.uf?uform():""}${cd("Comptes utilisateurs",T(["Identifiant","Nom","Rôle","Statut","Actions"],S.U.map(u=>[u.l,u.n+(u.cid?" · "+cn(u.cid):""),RN[u.role],u.lock?bd("Bloqué","r"):bd(u.st,u.st=="Actif"?"gr":"n"),`<button class="bg sm" data-a="edu:${u.l}">Modifier</button> `+(u.lock?`<button class="bt sm" data-a="unl:${u.l}">Débloquer</button> `:"")+`<button class="bg sm" data-a="rst:${u.l}">Réinitialiser</button> `+(u.l!=S.user.l?`<button class="bg sm" data-a="tgl:${u.l}">${u.st=="Actif"?"Suspendre":"Réactiver"}</button> `+(S.del=="u"+u.l?`<button class="bt sm" data-a="okdu:${u.l}">Confirmer</button> <button class="bg sm" data-a="cancel">Non</button>`:`<button class="bg sm" data-a="dlu:${u.l}">Supprimer</button>`):"")])))}${cd("Matrice des accès par rôle",T(["Module"].concat(RS.map(r=>RN[r])),M.map(m=>[VN[m][0]].concat(RS.map(r=>ROLES[r].nav.includes(m)?bd("Oui","gr"):bd("—","n"))))))+`<p class="mu">Le chauffeur accède uniquement à son espace personnel.</p>`}`}
function aud(){return cd("Journal d’audit",S.Lg.length?T(["Heure","Utilisateur","Événement"],S.Lg.map(l=>[l.h,l.u,l.a])):"<p class=mu>Aucun événement.</p>")}
setInterval(()=>{if(S.user&&Date.now()-S.tm>600000)logout("Session expirée après 10 minutes d’inactivité")},30000);
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&!S.user&&e.target.dataset&&e.target.dataset.f)doLogin()});

render();
